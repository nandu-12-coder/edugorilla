<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Start Mock Test</title>
  <style>
    body {
      background-color: #acc0d4; /* Purple background */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }

    .box {
      background: rgb(212, 230, 219);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 500px;
    }

    h2 {
      color: #660a7f; /* Purple heading */
      margin-bottom: 15px;
    }

    p {
      color: black;
      font-size: 16px;
      margin-bottom: 25px;
    }

    a.ready-link {
      color: #09362b; /* Green link */
      font-size: 25px;
      cursor: pointer;
    }

    a.ready-link:hover {
      color: #183758;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Ready to Begin?</h2>
    <p>This mock test contains multiple choice questions. Once started, the timer will begin.</p>
    <a href="begin1.html" class="ready-link">ready</a>
  </div>

</body>
</html>
